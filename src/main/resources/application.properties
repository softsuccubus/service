spring.application.name=service
server.port=8080

# ---------- 数据源（与 docker-compose.yml 一致） ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/service?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:service}
spring.datasource.password=${DB_PASSWORD:service123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# ---------- 认证 ----------
# 生产部署必须通过 APP_AUTH_SECRET 覆盖该默认值
app.auth.token-secret=${APP_AUTH_SECRET:dev-only-secret-please-change-me-0123456789}
app.auth.token-ttl-minutes=480

# ---------- 评测 ----------
# mock：课程阶段模拟评测引擎，不执行任意用户代码；sandbox：生产隔离执行器（本期未提供实现）
app.judge.engine=${JUDGE_ENGINE:mock}
app.judge.supported-languages=JAVA,CPP,PYTHON
app.judge.test-data-root=${JUDGE_TEST_DATA_ROOT:./data/test-data}
app.judge.worker.enabled=${JUDGE_WORKER_ENABLED:true}
app.judge.worker.concurrency=${JUDGE_WORKER_CONCURRENCY:2}
app.judge.worker.batch-size=10
app.judge.worker.max-attempts=3
app.judge.worker.lease-seconds=60
app.judge.worker.poll-interval-ms=2000
app.judge.worker.recovery-interval-ms=60000
app.judge.outbox.poll-interval-ms=1000

# ---------- 考试生命周期 ----------
# 到点自动开始/结束考试、超时记录自动过期
app.exam.lifecycle.enabled=${EXAM_LIFECYCLE_ENABLED:true}
app.exam.lifecycle.interval-ms=5000

# ---------- 演示数据 ----------
# 首次启动创建内置角色与演示账号；生产环境应设为 false
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:admin123456}
app.seed.teacher-password=${APP_SEED_TEACHER_PASSWORD:teacher123456}
app.seed.student-password=${APP_SEED_STUDENT_PASSWORD:student123456}

# ---------- 跨域 ----------
app.cors.allowed-origins=${APP_CORS_ORIGINS:*}

# ---------- 可观测性 ----------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
