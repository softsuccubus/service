spring.application.name=service

# ---------- 测试数据源（H2 内存库，MySQL 兼容模式） ----------
spring.datasource.url=jdbc:h2:mem:service-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- 认证 ----------
app.auth.token-secret=test-secret-key-for-integration-tests-0123456789
app.auth.token-ttl-minutes=60

# ---------- 评测 ----------
app.judge.engine=mock
app.judge.supported-languages=JAVA,CPP,PYTHON
app.judge.test-data-root=./target/test-data
app.judge.worker.enabled=false
app.judge.worker.concurrency=1
app.judge.worker.batch-size=10
app.judge.worker.max-attempts=3
app.judge.worker.lease-seconds=60
app.judge.worker.poll-interval-ms=600000
app.judge.worker.recovery-interval-ms=600000
app.judge.outbox.poll-interval-ms=600000

# ---------- 考试生命周期 ----------
app.exam.lifecycle.enabled=false
app.exam.lifecycle.interval-ms=600000

# ---------- 演示数据 ----------
app.seed.enabled=false

app.cors.allowed-origins=*
